esphome:
  name: test-esp32-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [warema_cover_hub]

remote_transmitter:
  id: rf_transmitter
  pin: GPIO4
  carrier_duty_percent: 100%

remote_receiver:
  id: rf_receiver
  pin: GPIO14
  filter: 400us
  idle: 10ms

warema_cover_hub:
  id: warema_hub
  transmitter_id: rf_transmitter
  receiver_id: rf_receiver
  number_of_transmissions: 3

cover:
  - platform: warema_cover_hub
    id: cover_1
    name: "Cover 1"
    command: "111"
    devicecode1: "101010010"
    devicecode2: "101010011"
    open_duration: 24s
    close_duration: 24s

  - platform: warema_cover_hub
    name: "Cover 2"
    command: "110"
    devicecode1: "101010010"
    devicecode2: "101010011"
    open_duration: 16s
    close_duration: 18s

switch:
  - platform: warema_cover_hub
    name: "Receive Warema codes"

text_sensor:
  - platform: warema_cover_hub
    name: "Received Warema code"

event:
  - platform: warema_cover_hub
    name: "Remote Cover 1"
    cover_id: cover_1
