esphome:
  name: test-esp32-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [warema_cover_hub]

remote_transmitter:
  id: rf_transmitter
  pin: GPIO4
  carrier_duty_percent: 100%

remote_receiver:
  id: rf_receiver
  pin: GPIO14
  filter: 400us
  idle: 10ms

warema_cover_hub:
  id: warema_hub
  transmitter_id: rf_transmitter
  receiver_id: rf_receiver
  on_unassigned:
    - logger.log:
        format: "Unassigned %s on channel %s: %s"
        args: ["key.c_str()", "command.c_str()", "description.c_str()"]
  number_of_transmissions: 3

cover:
  - platform: warema_cover_hub
    id: cover_1
    name: "Cover 1"
    command: "111"
    devicecode1: "101010010"
    devicecode2: "101010011"
    open_duration: 24s
    close_duration: 24s

  - platform: warema_cover_hub
    id: cover_2
    name: "Cover 2"
    follow_remote: false
    command: "110"
    devicecode1: "101010010"
    devicecode2: "101010011"
    additional_remotes:
      - command: "001"
        devicecode1: "110011001"
        devicecode2: "110011010"
    open_duration: 16s
    close_duration: 18s

  - platform: warema_cover_hub
    id: cover_all
    name: "All covers"
    command: "011"
    devicecode1: "101010010"
    devicecode2: "101010011"
    open_duration: 24s
    close_duration: 24s
    members: [cover_1, cover_2]

button:
  - platform: warema_cover_hub
    cover_id: cover_1
    learn:
      name: "Learn Cover 1"
      duration: 4s

switch:
  - platform: warema_cover_hub
    name: "Show Warema codes"

text_sensor:
  - platform: warema_cover_hub
    name: "Received Warema code"

event:
  - platform: warema_cover_hub
    name: "Remote Cover 1"
    cover_id: cover_1
