esphome:
  name: test-sniffer-esp8266-ard

esp8266:
  board: d1_mini

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [warema_cover_hub]

remote_receiver:
  id: rf_receiver
  pin: D5
  filter: 400us
  idle: 10ms
  buffer_size: 4kb

warema_cover_hub:
  receiver_id: rf_receiver

switch:
  - platform: warema_cover_hub

text_sensor:
  - platform: warema_cover_hub

event:
  - platform: warema_cover_hub
    name: "Remote channel 2"
    command: "110"
    devicecode1: "101010010"
    devicecode2: "101010011"
